# Copy this file to config.yaml. Keep the real file out of Git.
ib:
  host: "127.0.0.1"
  port: 4002
  client_id: 31
  connect_timeout_seconds: 10
  request_timeout_seconds: 30

paths:
  raw_data_dir: "./data/raw"
  intermediate_data_dir: "./data/processed"
  output_dir: "./data/output"
  checkpoint_file: "./data/checkpoint.json"
  log_dir: "./logs"

prices:
  # symbols.example.csv = 2-name demo; symbols.sp500.csv = full S&P 500
  # (2000-2025 membership still trading, derived from the FINSABER dataset).
  symbols_file: "./symbols.example.csv"
  duration: "5 Y"
  use_rth: true

news:
  symbols:
    - "AAPL"
    - "MSFT"
  providers:
    - "BRFG"
    - "BRFUPDN"
    - "DJNL"
  lookback_days: 2
  overlap_minutes: 5
  limit: 100
  # Backwards-pagination page budget per run; a backlog beyond
  # limit*max_pages is reported and needs this raised to cover it.
  max_pages: 5

stream:
  # Streaming quotes via reqMktData. market_data_type 3 = delayed (free paper
  # tier, 15-20 min behind); 1 = real time once market-data subscriptions exist.
  symbols:
    - "AAPL"
    - "MSFT"
  duration_seconds: 60
  market_data_type: 3
  # stream-pipeline: micro-batch write cadence; duration_seconds 0 = run until stopped.
  flush_interval_seconds: 5

run:
  max_retries: 3
  retry_delay_seconds: 5
  continue_on_error: true
  # Pause between symbols; keeps a full S&P-500 sweep under IBKR pacing limits.
  symbol_delay_seconds: 1.0
