data_source:
  name: "IBKR daily stock bars and news headlines"
  provider: "Interactive Brokers LLC"
  description: >-
    Historical daily stock OHLCV bars and historical news headline metadata
    available to the authenticated IBKR paper-trading username.

api:
  endpoint: >-
    TWS API socket exposed by a LOCAL IB Gateway session (default
    127.0.0.1:4002); reqContractDetails, reqHistoricalData, reqNewsProviders,
    and reqHistoricalNews. This is not a hosted REST endpoint: IBKR's cloud
    Web API requires a funded IBKR Pro account, so the free paper route is
    the TWS/Gateway socket only.
  auth_method: >-
    Interactive login in IB Gateway; the Python socket client uses host, port,
    and client ID and does not receive account credentials
  rate_limit: >-
    IBKR request pacing applies. The collector sends requests sequentially and
    retries errors using the configured delay; news availability depends on the
    username's API news providers.
  docs_url: "https://interactivebrokers.github.io/tws-api/"

output:
  schema: "schema.md"
  format: >-
    Raw JSONL; normalised and final Apache Parquet (prices, news, plus derived
    indicators and alphas datasets)
  update_frequency: "Configurable; intended for daily scheduled collection"

storage_policy:
  raw_data_location: >-
    OneDrive (University of Edinburgh) folder FinStream-IBKR-data/raw:
    https://uoe-my.sharepoint.com/:f:/g/personal/s2812542_ed_ac_uk/IgB50G9tIVHySa8fnT5FRAydAflsnIHy3ewhnADd8bGk0BQ?e=s0UCok
  intermediate_data_location: >-
    Same OneDrive folder, FinStream-IBKR-data/intermediate (local runtime path is
    configured via paths.intermediate_data_dir in config.yaml)
  final_dataset_location: >-
    Same OneDrive folder, FinStream-IBKR-data/final (Spark-readable partitioned
    parquet as documented in schema.md; local runtime path via paths.output_dir)
  access_instructions: >-
    The link above is scoped to University of Edinburgh accounts with view access;
    open it signed in with a UoE account. For write access or a different scope,
    contact Shanmin Sun (s2812542@ed.ac.uk). Collection runs locally against an
    authorised IBKR paper login (no credentials in the repo); outputs are synced
    from the configured local paths into the OneDrive folder above.

notes: >-
  Integration note: unlike key-based cloud APIs, this source needs a logged-in
  IB Gateway paper session on the collector host (one active session per
  username; periodic re-login). FinStream should therefore consume this
  pipeline's partitioned parquet outputs (OneDrive/db hand-off) rather than
  call IBKR directly from the orchestrator.
  GitHub contains code, schema, and synthetic samples only. News article bodies
  are not requested or stored. Account, order, and delayed snapshot checks are
  outside the persisted production datasets.
