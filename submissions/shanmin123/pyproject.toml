[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finstream-ibkr-pipeline"
version = "0.1.0"
description = "IBKR Gateway collection pipeline: prices, news, technical indicators, Alpha101 subset, and streaming quotes"
requires-python = ">=3.8"
dependencies = [
    "ibapi==9.81.1.post1",
    "pandas==1.3.5",
    "numpy==1.22.4",
    "pyarrow==12.0.1",
    "PyYAML==6.0.1",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary==2.9.9"]

[tool.setuptools]
packages = ["pipeline"]
